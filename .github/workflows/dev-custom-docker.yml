name: Dev Custom Docker

on:
  push:
    branches:
      - dev_custom
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-custom-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="$(printf 'ghcr.io/%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          {
            echo "name=${image}"
            echo "tags<<EOF"
            echo "${image}:dev_custom"
            echo "${image}:dev_custom-${short_sha}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=dev-custom-docker
          cache-to: type=gha,mode=max,scope=dev-custom-docker
          provenance: false
          build-args: |
            OPENCLAW_DOCKER_APT_UPGRADE=0

      - name: Print image
        run: |
          echo "Pushed:"
          echo "${{ steps.image.outputs.tags }}"
