name: Dev Custom Docker

on:
  push:
    branches:
      - dev_custom
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-custom-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="$(printf 'ghcr.io/%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          {
            echo "name=${image}"
            echo "tags<<EOF"
            echo "${image}:dev_custom"
            echo "${image}:dev_custom-${short_sha}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=dev-custom-docker
          cache-to: type=gha,mode=max,scope=dev-custom-docker
          provenance: false
          build-args: |
            OPENCLAW_DOCKER_APT_UPGRADE=0

      - name: Print image
        run: |
          echo "Pushed:"
          echo "${{ steps.image.outputs.tags }}"
